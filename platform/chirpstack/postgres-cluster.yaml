# ChirpStack PostgreSQL — CloudNativePG cluster (HA, automatic failover)
# CNPG generates the credentials Secret `chirpstack-db-app` (keys: username,
# password, uri, ...). ChirpStack consumes the `uri` key as its DSN.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: chirpstack-db
  namespace: lorawan
spec:
  instances: 3
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: chirpstack
      owner: chirpstack
      postInitApplicationSQL:
        # Required by ChirpStack v4 migrations
        - CREATE EXTENSION IF NOT EXISTS pg_trgm;
        - CREATE EXTENSION IF NOT EXISTS hstore;
